<!doctype html>
<html lang="en">
<head>

  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#17110c">
  <meta property="og:title" content="What's My Motivation Today?">

  <link rel="preload" as="image" href="assets/img/frame.webp" type="image/webp" fetchpriority="high">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&display=swap">

  <style>
    /* Paint the table colors before the app bundle loads. */
    html, body { margin: 0; height: 100%; background: #17110c; }
  </style>
