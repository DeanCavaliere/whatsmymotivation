<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Roll a d20 to find out how motivated you'll be today. Natural 20? Carpe diem. Natural 1? Back to bed.">
  <meta name="theme-color" content="#161719">
  <meta property="og:title" content="What's My Motivation Today?">

  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">

  <meta name="mobile-web-app-capable" content="yes">

  <link rel="preload" as="image" href="assets/img/frame.webp" type="image/webp" fetchpriority="high">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&display=swap" crossorigin>

  <style>
    /* Paint the table colors before the app bundle loads. */
